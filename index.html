<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Save the Date — Petal Promise</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,500&family=Cinzel:wght@400;500&family=GFS+Didot&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { overflow-x: hidden; }
  body {
    background: #f0e8de;
    font-family: "Cormorant Garamond", serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  body.pp-lock { overflow: hidden; }

  /* ============ INTRO ============ */
  .pp-intro {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #140d0a;
    overflow: hidden;
    transition: opacity 1.05s ease, transform 1.4s cubic-bezier(.16,1,.3,1);
  }
  .pp-intro.pp-hide {
    opacity: 0;
    transform: scale(1.07);
    pointer-events: none;
  }
  .pp-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #140d0a;
    display: block;
  }
  .pp-tap-hint {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    border-radius: 999px;
    border: 1px solid rgba(244,233,223,.45);
    background: rgba(20,13,10,.58);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 22px rgba(0,0,0,.35);
    font-family: "Cinzel", serif;
    font-size: 11px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: #f4e9df;
    text-shadow: 0 1px 8px rgba(0,0,0,.55);
    pointer-events: none;
    white-space: nowrap;
    animation: ppTapFloat 2.4s ease-in-out infinite;
    transition: opacity .6s ease;
  }
  .pp-tap-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f4e9df;
    box-shadow: 0 0 12px rgba(244,233,223,.75);
    flex-shrink: 0;
    animation: ppTapBlink 1.6s ease-in-out infinite;
  }
  @keyframes ppTapFloat {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-5px); }
  }
  @keyframes ppTapBlink {
    0%, 100% { opacity: .4; }
    50%      { opacity: 1; }
  }
  .pp-intro.pp-playing .pp-tap-hint {
    opacity: 0;
    animation: none;
  }

  /* ============ HERO ============ */
  .pp-hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    padding: 32px 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: #f0e8de;
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  .pp-hero.pp-show { opacity: 1; }
  .pp-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 55% at 50% 15%, rgba(200,155,130,.15) 0%, transparent 58%),
      radial-gradient(ellipse 55% 55% at 5% 92%, rgba(170,130,110,.10) 0%, transparent 52%);
  }

  .pp-sc {
    position: relative;
    z-index: 2;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
  }
  .pp-hero.pp-show .pp-sc {
    animation: ppFU 1.4s cubic-bezier(.16,1,.3,1) .25s forwards;
  }
  @keyframes ppFU {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 1. Couple image — first in the hero, sized like the reveal section */
  .pp-fc {
    display: block;
    width: min(340px, calc(100vw - 40px));
    height: auto;
    max-height: 42vh;
    object-fit: contain;
    margin-bottom: 16px;
    filter: drop-shadow(0 10px 22px rgba(120,70,50,.20));
  }

  /* 2. Names */
  .pp-hd { text-align: center; margin-bottom: 18px; }
  .pp-ey {
    font-family: "Cinzel", serif;
    font-size: 11px;
    letter-spacing: 4.5px;
    text-transform: uppercase;
    color: #9a7060;
    opacity: .8;
    margin-bottom: 7px;
  }
  .pp-nm {
    margin: 0;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(36px, 9.5vw, 54px);
    font-weight: 300;
    font-style: italic;
    line-height: 1;
    letter-spacing: -.5px;
    color: #2a1510;
  }
  .pp-am {
    display: inline-block;
    margin: 0 7px;
    font-family: "GFS Didot", serif;
    font-style: normal;
    font-weight: 400;
    font-size: .90em;
    color: #9a7060;
  }

  /* 3. Reveal date (heart) */
  .pp-hw {
    position: relative;
    width: min(340px, calc(100vw - 40px));
    flex-shrink: 0;
  }
  .pp-sv { display: block; width: 100%; height: auto; overflow: visible; }
  .pp-tc {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block; pointer-events: none;
  }
  .pp-pc { position: absolute; top: 0; left: 0; display: block; pointer-events: none; }
  .pp-ov {
    position: absolute; inset: 0;
    touch-action: none;
    cursor: none;
  }

  .pp-hn {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: opacity .5s ease;
  }
  .pp-hh {
    width: 20px; height: 20px;
    flex-shrink: 0;
    opacity: .75;
    animation: ppHF 1.8s ease-in-out infinite;
  }
  @keyframes ppHF {
    0%, 100% { transform: translate(0,0) rotate(-8deg); }
    50%      { transform: translate(3px,-3px) rotate(5deg); }
  }
  .pp-ht {
    font-family: "Cinzel", serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #9a7060;
    opacity: .85;
    animation: ppHP 2.8s ease-in-out 1.5s infinite;
  }
  @keyframes ppHP { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  /* 4. Countdown & location — shown after reveal */
  .pp-after {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .pp-count, .pp-loc {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1);
  }
  .pp-after.show .pp-count { opacity: 1; transform: none; transition-delay: .05s; }
  .pp-after.show .pp-loc   { opacity: 1; transform: none; transition-delay: .45s; }

  .pp-count { display: flex; align-items: flex-start; gap: 18px; }
  .pp-cd {
    min-width: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .pp-cd b {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-size: 26px;
    line-height: 1;
    color: #2a1510;
    font-variant-numeric: tabular-nums;
  }
  .pp-cd i {
    font-family: "Cinzel", serif;
    font-style: normal;
    font-size: 8px;
    letter-spacing: 2.2px;
    text-transform: uppercase;
    color: #9a7060;
    opacity: .9;
  }

  .pp-loc {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 11px 22px;
    border-radius: 999px;
    border: 1px solid rgba(200,160,144,.6);
    background: rgba(255,255,255,.42);
    font-family: "Cinzel", serif;
    font-size: 10px;
    letter-spacing: 2.6px;
    text-transform: uppercase;
    color: #8a6858;
    text-decoration: none;
    transition:
      opacity .9s cubic-bezier(.16,1,.3,1),
      transform .9s cubic-bezier(.16,1,.3,1),
      background .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
  }
  .pp-loc:hover {
    background: rgba(255,255,255,.85);
    border-color: #c8a090;
    color: #6f5044;
    box-shadow: 0 6px 16px rgba(150,100,80,.14);
  }
  .pp-loc svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* ============ FIXED LAYERS ============ */
  #pp-cc { position: fixed; inset: 0; z-index: 9999; pointer-events: none; }
  #pp-cur {
    position: fixed; z-index: 9999;
    width: 32px; height: 40px;
    display: none;
    opacity: .75;
    pointer-events: none;
    transform: translate(-8px, -4px);
  }

  #pp-music {
    position: fixed;
    right: 22px; bottom: 22px;
    width: 52px; height: 52px;
    min-width: 52px; min-height: 52px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: rgba(154,112,96,.92);
    box-shadow: 0 3px 14px rgba(0,0,0,.22);
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s, visibility .4s, transform .2s;
    -webkit-appearance: none;
    appearance: none;
    z-index: 10000;
  }
  #pp-music.pp-vis { opacity: 1; visibility: visible; }
  #pp-music:hover { transform: scale(1.08); }
  #pp-music svg { width: 20px; height: 20px; fill: #fff; display: block; flex-shrink: 0; }

  @media (prefers-reduced-motion: reduce) {
    .pp-sc, .pp-hh, .pp-ht, .pp-tap-hint, .pp-tap-dot { animation: none; }
    .pp-hero.pp-show .pp-sc { animation: none; opacity: 1; }
    .pp-count, .pp-loc { transition: opacity .3s linear, transform .3s linear; }
  }
</style>
</head>

<body>

<canvas id="pp-cc"></canvas>

<svg id="pp-cur" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" aria-hidden="true">
  <g fill="none" stroke="#9a7060" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 5 Q14 3 15.5 3 Q17 3 17 5 L17 16"/>
    <path d="M17 8 Q17 6 18.5 6 Q20 6 20 8 L20 16"/>
    <path d="M20 10 Q20 8 21.5 8 Q23 8 23 10 L23 16"/>
    <path d="M14 12.5 Q12.5 12.5 12 13.5 Q11.5 15 12.5 15.5"/>
    <path d="M12.5 15.5 Q12 18.5 12.5 21.5 Q13 25 15.5 27 Q18.5 29 22 27 Q24.5 25 24.5 21.5 L23 16"/>
  </g>
</svg>

<audio id="pp-audio" preload="none" loop></audio>

<button id="pp-music" aria-label="Toggle background music" type="button">
  <svg id="pp-icon-pause" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="5" y="4" width="4" height="16" rx="1"/><rect x="15" y="4" width="4" height="16" rx="1"/>
  </svg>
  <svg id="pp-icon-play" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
    <polygon points="6,3 20,12 6,21"/>
  </svg>
</button>

<!-- ==================== INTRO ==================== -->
<section class="pp-intro" id="introScreen" aria-label="Intro">
  <video class="pp-video" id="introVideo" src="Assets/introvd.mp4"
         playsinline webkit-playsinline preload="auto"></video>
  <div class="pp-tap-hint" id="tapHint">
    <span class="pp-tap-dot"></span>
    <span>Tap to open</span>
  </div>
</section>

<!-- ==================== HERO ==================== -->
<section class="pp-hero" id="heroScreen">
  <div class="pp-sc">

    <!-- 1. Couple image -->
    <img class="pp-fc" src="Assets/framecouple.png" alt="Emily and James"
         onerror="this.style.display='none'">

    <!-- 2. Names -->
    <header class="pp-hd">
      <div class="pp-ey">Save the Date</div>
      <h1 class="pp-nm">Emily <span class="pp-am">&amp;</span> James</h1>
    </header>

    <!-- 3. Reveal date -->
    <div class="pp-hw" id="heartWrap">
      <svg class="pp-sv" viewBox="0 0 300 288" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <clipPath id="hClip">
            <path d="M150 272 C148 270 10 188 10 96 C10 50 46 16 90 16 C115 16 138 29 150 50 C162 29 185 16 210 16 C254 16 290 50 290 96 C290 188 152 270 150 272Z"/>
          </clipPath>
          <linearGradient id="ivG" x1="0" y1="0" x2=".5" y2="1">
            <stop offset="0%" stop-color="#fefcf8"/>
            <stop offset="100%" stop-color="#f8f0e4"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="300" height="288" fill="url(#ivG)" clip-path="url(#hClip)"/>
        <path d="M150 272 C148 270 10 188 10 96 C10 50 46 16 90 16 C115 16 138 29 150 50 C162 29 185 16 210 16 C254 16 290 50 290 96 C290 188 152 270 150 272Z"
              fill="none" stroke="#c8a090" stroke-width="1.2" opacity=".5"/>
      </svg>

      <canvas class="pp-tc" id="textCanvas" aria-hidden="true"></canvas>
      <canvas class="pp-pc" id="petalCanvas" aria-hidden="true"></canvas>

      <div class="pp-ov" id="evtOverlay" role="button" tabindex="0"
           aria-label="Brush the roses away to reveal the invitation"></div>
    </div>

    <div class="pp-hn" id="hintRow">
      <svg class="pp-hh" viewBox="0 0 24 28" fill="none" aria-hidden="true">
        <g stroke="#9a7060" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 3.5 Q11 2 12.2 2 Q13.5 2 13.5 3.5 L13.5 13"/>
          <path d="M13.5 6 Q13.5 4.5 14.8 4.5 Q16 4.5 16 6 L16 13"/>
          <path d="M16 7.5 Q16 6 17.2 6 Q18.5 6 18.5 7.5 L18.5 13"/>
          <path d="M11 10.5 Q9.5 10.5 9 11.5 Q8.5 13 9.5 13.5"/>
          <path d="M9.5 13.5 Q9 16 9.5 19 Q10 22 12 23.5 Q15 25.5 17.5 23.5 Q19.5 22 19.5 19 L18.5 13"/>
        </g>
      </svg>
      <div class="pp-ht">Brush the petals to reveal</div>
    </div>

    <!-- 4. Countdown & location — shown after reveal -->
    <div class="pp-after" id="afterBox">

      <div class="pp-count" aria-label="Countdown to 26 August 2027">
        <div class="pp-cd"><b id="cd-d">00</b><i>Days</i></div>
        <div class="pp-cd"><b id="cd-h">00</b><i>Hours</i></div>
        <div class="pp-cd"><b id="cd-m">00</b><i>Mins</i></div>
        <div class="pp-cd"><b id="cd-s">00</b><i>Secs</i></div>
      </div>

      <a class="pp-loc"
         href="https://www.google.com/maps/search/?api=1&amp;query=Central+Park%2C+New+York"
         target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/>
          <circle cx="12" cy="10" r="2.6"/>
        </svg>
        <span>Central Park, New York</span>
      </a>

    </div>

  </div>
</section>

<script>
(function () {
  "use strict";

  /* ================= CONFIG ================= */
  var ROSE_URL = "Assets/rose.png";  /* path to your rose image (case-sensitive on servers) */
  var MUSIC_URL = "";                /* put an .mp3 URL here to enable the music button */
  var PETAL_COUNT = 340;
  var BRUSH_RADIUS = 54;
  var BRUSH_FORCE = 4.2;
  var REVEAL_RATIO = 0.15;

  var HEART_D = "M150 272 C148 270 10 188 10 96 C10 50 46 16 90 16 C115 16 138 29 150 50 C162 29 185 16 210 16 C254 16 290 50 290 96 C290 188 152 270 150 272Z";
  var HEART = new Path2D(HEART_D);

  var SW = 300, SH = 288;
  var OFF = 90;
  var CW = SW + OFF * 2, CH = SH + OFF * 2;

  /* ================= INTRO → HERO ================= */
  var introScreen  = document.getElementById("introScreen"),
      introVideo   = document.getElementById("introVideo"),
      heroScreen   = document.getElementById("heroScreen"),
      heroShown    = false,
      introStarted = false,
      videoBroken  = false,
      fallbackTimer= null;

  document.body.classList.add("pp-lock");

  function showHero() {
    if (heroShown) return;
    heroShown = true;
    clearTimeout(fallbackTimer);
    try { introVideo.pause(); } catch (e) {}

    introScreen.classList.add("pp-hide");      /* fade + zoom out */
    heroScreen.classList.add("pp-show");       /* cross-fade in      */
    document.body.classList.remove("pp-lock");

    setTimeout(function () {
      introScreen.style.display = "none";
    }, 1300);

    setTimeout(function () { resize(); drawText(); }, 80);
  }

  function playIntro() {
    if (introStarted) return;
    introStarted = true;

    if (videoBroken) { showHero(); return; }

    introScreen.classList.add("pp-playing");

    var pr = introVideo.play();
    if (pr && typeof pr.catch === "function") {
      pr.catch(function () {
        /* sound may be blocked → retry muted */
        introVideo.muted = true;
        var pr2 = introVideo.play();
        if (pr2 && typeof pr2.catch === "function") {
          pr2.catch(function () { showHero(); });
        }
      });
    }

    /* safety net: if the video never actually starts, move on */
    fallbackTimer = setTimeout(function () {
      if (introVideo.paused || introVideo.ended) showHero();
    }, 8000);
  }

  /* Tap anywhere on the intro starts it */
  introScreen.addEventListener("click", function () {
    if (!introStarted) playIntro();
  });

  introVideo.addEventListener("ended", showHero);
  introVideo.addEventListener("error", function () { videoBroken = true; });

  /* ================= ROSE SPRITES (from rose.png) ================= */
  var sprites = [];
  var aspect = 1;   /* width / height of the rose image */

  function makeSprite(img, flip) {
    var MAX = 96, PAD = 8;
    var iw = img.naturalWidth || img.width;
    var ih = img.naturalHeight || img.height;
    var sc = MAX / Math.max(iw, ih);
    var dw = Math.round(iw * sc), dh = Math.round(ih * sc);

    var c = document.createElement("canvas");
    c.width = dw + PAD * 2;
    c.height = dh + PAD * 2;
    var x = c.getContext("2d");

    x.translate(c.width / 2, c.height / 2);
    if (flip) x.scale(-1, 1);
    x.shadowColor = "rgba(96,44,32,0.28)";
    x.shadowBlur = 4;
    x.shadowOffsetX = 1;
    x.shadowOffsetY = 2;
    x.drawImage(img, -dw / 2, -dh / 2, dw, dh);
    return c;
  }

  function buildSprites(img) {
    sprites = [makeSprite(img, false), makeSprite(img, true)];
    aspect = sprites[0].width / sprites[0].height;
  }

  /* ================= ORBIT PATH ================= */
  var ORBIT = (function () {
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("width", "0");
    svg.setAttribute("height", "0");
    svg.style.cssText = "position:absolute;left:-9999px;top:0;";
    var path = document.createElementNS(NS, "path");
    path.setAttribute("d", HEART_D);
    svg.appendChild(path);
    document.body.appendChild(svg);

    var pts = [];
    var len = path.getTotalLength() || 1;
    var n = 280;
    for (var i = 0; i < n; i++) {
      var p = path.getPointAtLength(len * i / n);
      pts.push([p.x, p.y]);
    }
    document.body.removeChild(svg);
    return pts;
  })();

  /* ================= APP ================= */
  var txtCvs   = document.getElementById("textCanvas"),
      txtCtx   = txtCvs.getContext("2d"),
      cvs      = document.getElementById("petalCanvas"),
      ctx      = cvs.getContext("2d"),
      ovl      = document.getElementById("evtOverlay"),
      wrap     = document.getElementById("heartWrap"),
      hintRow  = document.getElementById("hintRow"),
      afterBox = document.getElementById("afterBox"),
      brushCur = document.getElementById("pp-cur"),
      cc       = document.getElementById("pp-cc"),
      ccx      = cc.getContext("2d"),
      testCtx  = document.createElement("canvas").getContext("2d");

  var ptls     = [],
      isDown   = false,
      revealed = false,
      orbiting = false,
      animating= false,
      musicDone= false,
      lastW    = 0,
      lx = 0, ly = 0,
      dateAlpha = 0,
      showDate  = false;

  /* ---------- text canvas ---------- */
  function tracked(c, text, cx, y, spacing) {
    c.textAlign = "center";
    var i, widths = [], total = 0, w;
    for (i = 0; i < text.length; i++) {
      w = c.measureText(text[i]).width;
      widths.push(w);
      total += w + spacing;
    }
    total -= spacing;
    var x = cx - total / 2;
    for (i = 0; i < text.length; i++) {
      c.fillText(text[i], x + widths[i] / 2, y);
      x += widths[i] + spacing;
    }
  }

  function sizeTextCanvas() {
    var r = wrap.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    txtCvs.width  = Math.round(SW * dpr);
    txtCvs.height = Math.round(SH * dpr);
    txtCvs.style.width  = r.width + "px";
    txtCvs.style.height = r.height + "px";
  }

  function drawText() {
    var dpr = window.devicePixelRatio || 1;
    txtCtx.setTransform(1, 0, 0, 1, 0, 0);
    txtCtx.clearRect(0, 0, SW * dpr, SH * dpr);
    txtCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    txtCtx.save();
    txtCtx.clip(HEART);
    txtCtx.textBaseline = "middle";

    txtCtx.font = "400 9.5px Cinzel, serif";
    txtCtx.fillStyle = "rgba(184,112,96,0.85)";
    tracked(txtCtx, "JOIN US TO CELEBRATE", 150, 104, 3);

    txtCtx.textAlign = "center";
    txtCtx.font = "300 14px 'Cormorant Garamond', serif";
    txtCtx.fillStyle = "rgba(138,104,88,1)";
    txtCtx.fillText("We joyfully invite you to witness", 150, 127);
    txtCtx.fillText("the beginning of our forever", 150, 146);

    txtCtx.strokeStyle = "rgba(184,112,96,0.30)";
    txtCtx.lineWidth = 0.8;
    txtCtx.beginPath();
    txtCtx.moveTo(122, 158);
    txtCtx.lineTo(178, 158);
    txtCtx.stroke();

    txtCtx.font = "italic 500 25px 'Cormorant Garamond', serif";
    txtCtx.fillStyle = "rgba(42,21,16," + (showDate ? dateAlpha.toFixed(2) : "0.12") + ")";
    txtCtx.fillText("26 August 2027", 150, 183);

    txtCtx.restore();
  }

  function animateDate() {
    showDate = true;
    (function step() {
      dateAlpha = Math.min(dateAlpha + 0.04, 1);
      drawText();
      if (dateAlpha < 1) requestAnimationFrame(step);
    })();
  }

  /* ---------- countdown ---------- */
  var TARGET = new Date(2027, 7, 26, 0, 0, 0).getTime();  /* 26 August 2027 */
  var elD = document.getElementById("cd-d"),
      elH = document.getElementById("cd-h"),
      elM = document.getElementById("cd-m"),
      elS = document.getElementById("cd-s");

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function tickCountdown() {
    var diff = TARGET - Date.now();
    if (diff < 0) diff = 0;
    var total = Math.floor(diff / 1000);
    var d = Math.floor(total / 86400);
    var h = Math.floor((total % 86400) / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    elD.textContent = pad2(d);
    elH.textContent = pad2(h);
    elM.textContent = pad2(m);
    elS.textContent = pad2(s);
  }
  tickCountdown();
  setInterval(tickCountdown, 1000);

  /* ---------- petals (roses) ---------- */
  function makePetal(sx, sy) {
    var idx = Math.floor(Math.random() * sprites.length);
    var size = 32 + Math.random() * 16;   /* height; width follows the image's aspect */
    return {
      x: sx + OFF,
      y: sy + OFF,
      vx: (Math.random() - .5) * .10,
      vy: (Math.random() - .5) * .10,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - .5) * .018,
      w: size * aspect,
      h: size,
      idx: idx,
      op: Math.random() * .10 + .86,
      bvx: 0,
      bvy: 0,
      fr: .83,
      phase: "pile",
      oT: Math.random(),
      oTgt: 0,
      oP: Math.random() * Math.PI * 2,
      age: 0,
      alive: true
    };
  }

  function generatePetals() {
    ptls = [];
    var tries = 0;
    while (ptls.length < PETAL_COUNT && tries < 12000) {
      tries++;
      var x = 14 + Math.random() * (SW - 28);
      var y = 18 + Math.random() * (SH - 36);
      if (testCtx.isPointInPath(HEART, x, y)) ptls.push(makePetal(x, y));
    }
  }

  function drawPetal(p) {
    if (!p.alive) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.op;
    ctx.drawImage(sprites[p.idx], -p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }

  function paintPile() {
    ctx.clearRect(0, 0, CW, CH);
    ctx.save();
    ctx.translate(OFF, OFF);
    ctx.clip(HEART);
    ctx.translate(-OFF, -OFF);
    for (var i = 0; i < ptls.length; i++) drawPetal(ptls[i]);
    ctx.restore();
  }

  /* ---------- resize ---------- */
  function resize() {
    var r = wrap.getBoundingClientRect();

    if (Math.abs(r.width - lastW) > 1) {
      lastW = r.width;

      cvs.width  = CW;
      cvs.height = CH;

      var sc = r.width / SW;
      var off = OFF * sc;
      cvs.style.width  = (r.width + off * 2) + "px";
      cvs.style.height = (r.height + off * 2) + "px";
      cvs.style.left = (-off) + "px";
      cvs.style.top  = (-off) + "px";

      sizeTextCanvas();
      if (!animating) paintPile();
    }
    drawText();
  }

  /* ---------- main loop ---------- */
  function startAnimation() {
    if (animating) return;
    animating = true;
    loop();
  }

  function loop() {
    ctx.clearRect(0, 0, CW, CH);

    if (!orbiting) {
      ctx.save();
      ctx.translate(OFF, OFF);
      ctx.clip(HEART);
      ctx.translate(-OFF, -OFF);
    }

    for (var i = 0; i < ptls.length; i++) {
      var p = ptls[i];
      if (!p.alive) continue;

      if (p.phase === "pile") {
        p.x += p.vx + p.bvx;
        p.y += p.vy + p.bvy;
        p.bvx *= p.fr;
        p.bvy *= p.fr;
        p.rotV *= .97;
        p.rot += p.rotV;

        p.x = Math.max(OFF + 8,  Math.min(OFF + SW - 8,  p.x));
        p.y = Math.max(OFF + 14, Math.min(OFF + SH - 14, p.y));

      } else if (p.phase === "orbit") {
        p.age++;
        var diff = p.oTgt - p.oT;
        if (diff >  .5) diff -= 1;
        if (diff < -.5) diff += 1;
        var spd = p.age < 20 ? .18 : .065;
        p.oT += diff * spd;
        p.oT = (p.oT % 1 + 1) % 1;

        var op = ORBIT[Math.floor(p.oT * ORBIT.length) % ORBIT.length];
        p.x += (op[0] + OFF + Math.cos(p.age * .026 + p.oP) * 2   - p.x) * .14;
        p.y += (op[1] + OFF + Math.sin(p.age * .020 + p.oP) * 2.5 - p.y) * .14;
        p.rot += .009;

        if (p.age > 45) {
          p.op -= .018;
          if (p.op <= 0) p.alive = false;
        }
      }

      drawPetal(p);
    }

    if (!orbiting) ctx.restore();
    if (animating) requestAnimationFrame(loop);
  }

  /* ---------- brush ---------- */
  function toCanvas(clientX, clientY) {
    var r = ovl.getBoundingClientRect();
    var sc = SW / r.width;
    return { x: (clientX - r.left) * sc + OFF, y: (clientY - r.top) * sc + OFF };
  }

  function brush(ax, ay, bx, by) {
    if (!musicDone) { musicDone = true; startMusic(); }

    var dx = ax - bx, dy = ay - by;
    var sp2 = Math.sqrt(dx * dx + dy * dy);
    var nx = sp2 > .5 ? dx / sp2 : 0;
    var ny = sp2 > .5 ? dy / sp2 : 0;

    for (var i = 0; i < ptls.length; i++) {
      var p = ptls[i];
      if (p.phase !== "pile") continue;

      var px = p.x - ax, py = p.y - ay;
      var dist = Math.sqrt(px * px + py * py);

      if (dist < BRUSH_RADIUS && dist > .5) {
        var f = (1 - dist / BRUSH_RADIUS) * BRUSH_FORCE * (1 + sp2 * .05);
        var ang = Math.atan2(py, px);
        p.bvx += Math.cos(ang) * f * .85 + nx * f * .55;
        p.bvy += Math.sin(ang) * f * .85 + ny * f * .35;
        p.rotV += (Math.random() - .5) * .13;
      }
    }

    startAnimation();
    if (!revealed) checkReveal();
  }

  function checkReveal() {
    var cnt = 0;
    for (var i = 0; i < ptls.length; i++) {
      var p = ptls[i];
      var dx = (p.x - OFF) - 150, dy = (p.y - OFF) - 148;
      if (Math.sqrt(dx * dx + dy * dy) < 72) cnt++;
    }
    if (cnt < ptls.length * REVEAL_RATIO) doReveal();
  }

  function doReveal() {
    if (revealed) return;
    revealed = true;

    hintRow.style.opacity = "0";
    animateDate();                                  /* 1) date fades in   */

    setTimeout(function () {
      hintRow.style.visibility = "hidden";          /* keep layout space  */
    }, 600);

    setTimeout(function () {                        /* 2) countdown       */
      afterBox.classList.add("show");               /*    + location      */
    }, 700);

    setTimeout(startOrbit, 400);
  }

  function startOrbit() {
    orbiting = true;
    startAnimation();
    for (var i = 0; i < ptls.length; i++) {
      var p = ptls[i];
      p.phase = "orbit";
      p.oTgt = i / ptls.length;
      p.age = 0;
      p.op = Math.min(p.op, .82);
    }
    confetti();
  }

  /* ---------- confetti (falling roses) ---------- */
  function confetti() {
    cc.width  = window.innerWidth;
    cc.height = window.innerHeight;

    var ps = [];
    for (var i = 0; i < 70; i++) {
      var idx = Math.floor(Math.random() * sprites.length);
      var h = 25 + Math.random() * 11;
      ps.push({
        x: Math.random() * cc.width,
        y: -20 - Math.random() * 200,
        vy: Math.random() * 1.6 + 0.5,
        vx: (Math.random() - .5) * 1.6,
        w: h * aspect, h: h,
        rot: Math.random() * Math.PI * 2,
        rv: (Math.random() - .5) * .08,
        idx: idx,
        al: Math.random() * .4 + .55,
        dr: Math.random() * Math.PI * 2,
        ds: Math.random() * .022 + .008
      });
    }

    var f = 0, max = 340;

    (function draw() {
      ccx.clearRect(0, 0, cc.width, cc.height);
      var fade = Math.max(0, 1 - f / max);

      for (var i = 0; i < ps.length; i++) {
        var p = ps[i];
        ccx.save();
        ccx.globalAlpha = p.al * fade;
        ccx.translate(p.x, p.y);
        ccx.rotate(p.rot);
        ccx.drawImage(sprites[p.idx], -p.w / 2, -p.h / 2, p.w, p.h);
        ccx.restore();

        p.y += p.vy;
        p.x += p.vx + Math.sin(p.dr) * .5;
        p.rot += p.rv;
        p.dr += p.ds;

        if (p.y > cc.height + 20) {
          p.y = -20;
          p.x = Math.random() * cc.width;
        }
      }

      f++;
      if (f < max) requestAnimationFrame(draw);
      else ccx.clearRect(0, 0, cc.width, cc.height);
    })();
  }

  /* ---------- music ---------- */
  var audio   = document.getElementById("pp-audio"),
      musicBtn= document.getElementById("pp-music"),
      iconPause = document.getElementById("pp-icon-pause"),
      iconPlay  = document.getElementById("pp-icon-play"),
      musicReady = false;

  if (MUSIC_URL) {
    audio.src = MUSIC_URL;
    audio.volume = 0.75;
    musicReady = true;
  }

  function setPlayingUI(playing) {
    iconPause.style.display = playing ? "block" : "none";
    iconPlay.style.display  = playing ? "none"  : "block";
  }

  function startMusic() {
    if (!musicReady) return;
    audio.play().then(function () {
      musicBtn.classList.add("pp-vis");
      setPlayingUI(true);
    }).catch(function () {
      musicBtn.classList.add("pp-vis");
      setPlayingUI(false);
    });
  }

  musicBtn.addEventListener("click", function () {
    if (!musicReady) return;
    if (audio.paused) { audio.play(); setPlayingUI(true); }
    else { audio.pause(); setPlayingUI(false); }
  });

  /* ---------- pointer events ---------- */
  ovl.addEventListener("pointerenter", function () {
    brushCur.style.display = "block";
  });

  ovl.addEventListener("pointerleave", function () {
    isDown = false;
    brushCur.style.display = "none";
  });

  ovl.addEventListener("pointerdown", function (e) {
    if (ovl.setPointerCapture) {
      try { ovl.setPointerCapture(e.pointerId); } catch (err) {}
    }
    isDown = true;
    var c = toCanvas(e.clientX, e.clientY);
    lx = c.x; ly = c.y;
    brush(c.x, c.y, c.x, c.y);
  });

  ovl.addEventListener("pointermove", function (e) {
    brushCur.style.left = e.clientX + "px";
    brushCur.style.top  = e.clientY + "px";
    brushCur.style.display = "block";

    if (!isDown) return;
    var c = toCanvas(e.clientX, e.clientY);
    brush(c.x, c.y, lx, ly);
    lx = c.x; ly = c.y;
  });

  ovl.addEventListener("pointerup",     function () { isDown = false; });
  ovl.addEventListener("pointercancel", function () { isDown = false; });

  ovl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      doReveal();
    }
  });

  /* ================= BOOT (waits for rose.png) ================= */
  function boot(img) {
    buildSprites(img);
    generatePetals();
    lastW = 0;
    resize();
  }

  window.addEventListener("resize", resize);
  window.addEventListener("resize", function () {
    cc.width  = window.innerWidth;
    cc.height = window.innerHeight;
  });
  window.addEventListener("orientationchange", function () {
    setTimeout(resize, 250);
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawText);
  }
  setTimeout(drawText, 300);

  var roseImg = new Image();
  roseImg.onload = function () { boot(roseImg); };
  roseImg.onerror = function () {
    console.error("Could not load " + ROSE_URL + " — check the path and file name.");
  };
  roseImg.src = ROSE_URL;

})();
</script>
